name: veille-minipublics

on:
  schedule:
    - cron: "0 6 * * 1,3,5"   # lun/mer/ven 06:00 UTC — veille autonome
  workflow_dispatch: {}        # déclenchement manuel (webhook Odoo futur)

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      # Optionnel : affinage LLM du scoring/résumés (OPENAI_API_KEY en secret du repo)
      # À défaut, le scoring par mots-clés du cadrage humain s'applique.
      # - name: LLM refine
      #   if: ${{ secrets.OPENAI_API_KEY != '' }}
      #   run: python3 pipeline/llm_refine.py
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run veille
        run: python3 pipeline/veille.py

      - name: Build site (génération statique)
        run: python3 pipeline/build_site.py

      - name: Commit digest + site
        run: |
          git config user.name "veille-bot"
          git config user.email "action@github.com"
          git add digests/ site/
          if git diff --cached --quiet; then
            echo "Rien de nouveau — pas de commit"
          else
            git commit -m "veille: digest $(date -u +%F)"
            git push
          fi
